<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FlyBrain</title>
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; height: 100%; background: #070a0f; overflow: hidden; }
      canvas { display: block; }

      #juego { position: fixed; inset: 0; }

      /* El cerebro es una miniatura en la esquina: el juego es lo principal.
         Tres estados — miniatura, grande y escondido — con los botones de
         arriba a la derecha del panel. Si la pelea no trae actividad grabada,
         el panel no aparece. */
      #cerebro {
        position: fixed; top: 16px; right: 16px; z-index: 2;
        width: 300px; height: 240px; background: #070a0f;
        border: 1px solid #1b2836; overflow: hidden;
        transition: width .2s, height .2s;
      }
      #cerebro.grande { width: min(46vw, 760px); height: min(74vh, 680px); }
      #cerebro.oculto { width: 132px; height: 30px; }
      #cerebro.oculto canvas, #cerebro.oculto .rotulos > :not(.botones) { display: none; }
      /* En miniatura, solo lo que se lee de un vistazo: la fibra gigante. */
      #cerebro:not(.grande) .leyenda > :not(#escape),
      #cerebro:not(.grande) .lectura { display: none; }
      #cerebro:not(.grande) .titulo { font-size: 9px; top: 9px; left: 10px; }
      #cerebro:not(.grande) .leyenda { bottom: 8px; right: 10px; font-size: 10px; }
      .botones { top: 5px; right: 6px; pointer-events: auto; display: flex; gap: 4px; }
      .botones button {
        font: inherit; font-size: 11px; color: #8fa8bd; background: #0e1824;
        border: 1px solid #1b2836; padding: 2px 7px; cursor: pointer;
      }
      .botones button:hover { color: #dfe9f4; border-color: #35485f; }

      #hud, .rotulos {
        position: absolute; inset: 0; pointer-events: none;
        font: 12px/1.5 ui-monospace, "SF Mono", Menlo, monospace;
        color: #5d7186; letter-spacing: .08em; text-transform: uppercase;
      }
      #hud > div, .rotulos > div { position: absolute; }
      #tel { top: 16px; left: 20px; }
      #ayuda { bottom: 16px; left: 20px; }
      #fin {
        inset: 0; display: none; place-content: center; text-align: center;
        font-size: 20px; letter-spacing: .3em; color: #8fa8bd;
      }

      /* Barras técnicas, no de fantasía: un riel vacío y un relleno que baja.
         Nunca en el color de peligro — ese está reservado. */
      .barra { height: 4px; background: #1b2836; outline: 1px solid #35485f; }
      .barra > i { display: block; height: 100%; background: #8fa8bd;
                   transition: width .12s linear; }

      /* El boss cruza la pantalla arriba: es una pelea contra un boss y la
         barra lo dice antes que cualquier texto. */
      #boss { top: 46px; left: 50%; transform: translateX(-50%); width: min(80%, 640px); }
      #boss .barra > i { background: #dfe9f4; }
      #boss span { display: block; margin-bottom: 6px; text-align: center; font-size: 10px; }

      #vida { bottom: 44px; left: 20px; width: 200px; }
      #vida span { display: block; margin-bottom: 6px; font-size: 10px; }

      .rotulos .titulo { top: 16px; left: 20px; }
      .rotulos .lectura { bottom: 16px; left: 20px; }
      .rotulos .leyenda { bottom: 16px; right: 20px; text-align: right; }
      .punto { display: inline-block; width: 7px; height: 7px; border-radius: 50%;
               margin-right: 6px; vertical-align: 1px; }
      /* El ojo, abajo a la derecha: lo que vio la retina, tick a tick. Solo
         aparece si la pelea trae su `.ojo`. */
      #ojo {
        position: fixed; bottom: 16px; right: 16px; z-index: 2;
        width: 380px; height: 214px; background: #070a0f;
        border: 1px solid #1b2836;
      }
      #ojo canvas { width: 100%; height: 190px; }
      #ojo .rotulos > div { position: static; padding: 0 10px; font-size: 9px;
                            display: flex; justify-content: space-between; }

      #escape { color: #5d7186; transition: color .05s; }
      #escape.activa { color: #ffffff; }
    </style>
  </head>
  <body>
    <div id="juego">
    <div id="hud">
      <div id="tel"></div>
      <div id="boss">
        <span>espécimen</span>
        <div class="barra"><i id="bossHp"></i></div>
      </div>
      <div id="vida">
        <span>sujeto</span>
        <div class="barra"><i id="playerHp"></i></div>
      </div>
      <div id="ayuda">␣ pausa · r reiniciar · ?pelea=nombre para otra grabación</div>
      <div id="fin"></div>
    </div>
    </div>
    <div id="cerebro" hidden>
      <div class="rotulos">
        <div class="titulo">conectoma MaleCNS · <span id="neuronas"></span></div>
        <div class="botones">
          <button id="agrandar" title="agrandar / achicar">⤢</button>
          <button id="esconder" title="esconder / mostrar">–</button>
        </div>
        <div class="lectura" id="lectura"></div>
        <div class="leyenda">
          <div><span class="punto" style="background:#35d6c0"></span>LC4 + LPLC2 · detectan lo que se acerca</div>
          <div id="escape"><span class="punto" style="background:#fff"></span>DNp01 · fibra gigante → esquiva</div>
          <div><span class="punto" style="background:#dfe9f4;opacity:.5"></span>el resto · arrastrá para girar</div>
        </div>
      </div>
    </div>
    <div id="ojo" hidden>
      <canvas></canvas>
      <div class="rotulos" style="position:static"><div><span>← atrás · ojo izquierdo</span><span>frente</span><span>ojo derecho · atrás →</span></div></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
